<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Brawl Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --night: #1B2A6B;      /* фон — ночной синий ранкеда */
  --panel: #24379A;      /* панели */
  --panel-hi: #2E45B8;
  --ink: #0E1230;        /* толстые обводки и тени, как в игре */
  --gold: #FFC81E;       /* твой ход, главный совет */
  --red: #FF4D5E;        /* соперники */
  --blue: #3DB7FF;       /* вы */
  --text: #FFFFFF;
  --muted: #B9C3F2;
  --r-lg: 18px; --r-md: 12px; --r-sm: 9px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--night); color: var(--text);
  font-family: Rubik, system-ui, sans-serif; font-weight: 500; font-size: 15px; line-height: 1.35; }
body { padding: 10px 12px calc(84px + env(safe-area-inset-bottom)); min-height: 100vh;
  background: radial-gradient(120% 60% at 50% -10%, #2B3F9E 0%, var(--night) 60%) fixed; }
button { font: inherit; color: inherit; cursor: pointer; }
img { display: block; }

/* «игровой» текст: жирный, с тёмной тенью снизу */
.title { font-weight: 900; font-size: 22px; letter-spacing: .2px; margin: 4px 2px 12px;
  text-shadow: 0 2px 0 var(--ink), 0 3px 0 var(--ink); }
.sub { color: var(--muted); font-size: 13px; margin: -6px 2px 12px; }

.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.topbar .grow { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  background: var(--panel); border: 2px solid var(--ink); font-size: 12px; font-weight: 700; }
.iconbtn { border: 2px solid var(--ink); background: var(--panel); border-radius: var(--r-sm);
  padding: 6px 10px; font-weight: 800; box-shadow: 0 3px 0 var(--ink); }
.iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

/* сетки выбора режима и карты */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r-lg);
  background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); text-align: left;
  font-weight: 800; font-size: 15px; }
.mode img { width: 44px; height: 44px; object-fit: contain; flex: none; }
.mode:active, .mapcard:active, .big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.mapcard { border-radius: var(--r-md); overflow: hidden; background: var(--panel); border: 3px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink); padding: 0; text-align: left; }
.mapcard img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #16225a; }
.mapcard span { display: block; padding: 6px 7px 7px; font-weight: 800; font-size: 12px; line-height: 1.2; }
.mapcard.nomap { display: grid; place-items: center; min-height: 120px; font-weight: 800; padding: 10px; text-align: center; }

.big { width: 100%; padding: 16px; border-radius: var(--r-lg); border: 3px solid var(--ink);
  box-shadow: 0 5px 0 var(--ink); font-weight: 900; font-size: 18px; margin-bottom: 12px;
  text-shadow: 0 2px 0 rgba(14,18,48,.6); }
.big.us { background: var(--blue); } .big.them { background: var(--red); }

/* доска драфта */
.board { background: var(--panel); border: 3px solid var(--ink); border-radius: var(--r-lg);
  padding: 10px; box-shadow: 0 4px 0 var(--ink); margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.row:last-child { margin-bottom: 0; }
.row .lbl { width: 54px; flex: none; font-weight: 800; font-size: 12px; }
.row.us .lbl { color: var(--blue); } .row.them .lbl { color: var(--red); } .row.bans .lbl { color: var(--muted); }
.slot { width: 48px; height: 48px; border-radius: var(--r-sm); border: 2px dashed rgba(185,195,242,.45);
  background: rgba(14,18,48,.35); position: relative; flex: none; overflow: hidden; }
.row.bans .slot { width: 38px; height: 38px; }
.slot.filled { border-style: solid; border-color: var(--ink); }
.row.us .slot.filled { box-shadow: inset 0 0 0 2px var(--blue); }
.row.them .slot.filled { box-shadow: inset 0 0 0 2px var(--red); }
.row.bans .slot.filled img { filter: grayscale(1) brightness(.75); }
.row.bans .slot.filled::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 46%, var(--red) 46%, var(--red) 54%, transparent 54%); }
.slot.next { border: 3px solid var(--gold); background: rgba(255,200,30,.12); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,200,30,.25); } }
@media (prefers-reduced-motion: reduce) { .slot.next { animation: none; } }
.slot img { width: 100%; height: 100%; object-fit: cover; }

.phase { font-weight: 900; font-size: 17px; margin: 4px 2px 8px; text-shadow: 0 2px 0 var(--ink); }
.phase.us { color: var(--gold); } .phase.them { color: var(--red); }
.hint { color: var(--muted); font-size: 13px; margin: -4px 2px 10px; }

/* советы */
.recs { display: grid; gap: 8px; margin-bottom: 12px; }
.rec { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 9px; border-radius: var(--r-md);
  background: var(--panel-hi); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); text-align: left; width: 100%; }
.rec.top { background: var(--gold); color: var(--ink); }
.rec.top .why, .rec.top .build { color: #3a2e00; }
.rec:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.rec .ava { width: 56px; height: 56px; border-radius: var(--r-sm); overflow: hidden; border: 2px solid var(--ink); background: #16225a; }
.rec .ava img { width: 100%; height: 100%; object-fit: cover; }
.rec .nm { font-weight: 900; font-size: 16px; }
.rec .cls { font-weight: 700; font-size: 12px; opacity: .8; margin-left: 4px; }
.rec .why { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.rec .build { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--text); }
.rec .build span { display: inline-flex; align-items: center; gap: 4px; }
.rec .build img { width: 20px; height: 20px; object-fit: contain; }
.rec .build .where { font-weight: 700; font-size: 11px; opacity: .75; }
.meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 4px 0 10px; }
.mt { display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: var(--panel); border: 3px solid var(--ink); border-radius: var(--r-md); box-shadow: 0 3px 0 var(--ink); min-width: 0; }
.mt img { width: 36px; height: 36px; object-fit: contain; flex: none; }
.mt span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; }
.mt b { display: block; font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pc { min-width: 0; background: var(--panel); border: 3px solid var(--ink); border-radius: var(--r-md); padding: 8px; box-shadow: 0 3px 0 var(--ink); }
.pc.max { border-color: #6b4f00; background: linear-gradient(180deg, #2E45B8, var(--panel)); }
.pc-top { display: flex; align-items: center; gap: 8px; }
.pc-ava { position: relative; width: 46px; height: 46px; flex: none; border-radius: var(--r-sm); border: 2px solid var(--ink); overflow: visible; }
.pc-ava img, .pc-ava .ph { width: 100%; height: 100%; object-fit: cover; border-radius: 7px; font-size: 15px; }
.pw { position: absolute; right: -8px; bottom: -8px; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 999px;
  display: grid; place-items: center; font-weight: 900; font-size: 13px; background: #fff; color: var(--ink); border: 2px solid var(--ink); }
.pc.max .pw { background: var(--gold); }
.pc-name { font-weight: 900; font-size: 14px; line-height: 1.15; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 8px; }
.it { width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 900; border-radius: 6px; background: rgba(14,18,48,.45); }
.it img { width: 24px; height: 24px; object-fit: contain; }
.it.off { opacity: .22; filter: grayscale(1); }
.it.hc { color: #c77dff; font-size: 15px; }
.it.gear { background: transparent; }
.pc-row.bf b { font-size: 10.5px; font-weight: 800; color: var(--muted); }
.pc-row.bf { gap: 3px; }
.pc-row.bf b { width: 100%; }
.pc-row.bf span { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 999px; border: 2px solid var(--ink); opacity: .35; }
.pc-row.bf span.on { opacity: 1; background: #ff7ad9; color: var(--ink); }
.miss { color: var(--red); text-decoration: none; font-weight: 900; }
.acc { background: var(--panel); border: 3px solid var(--ink); border-radius: var(--r-lg); padding: 12px; margin-top: 14px; box-shadow: 0 4px 0 var(--ink); }
.acc .row2 { display: flex; gap: 8px; margin-top: 8px; }
.acc input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: var(--r-md); border: 3px solid var(--ink); font: inherit; font-weight: 700; text-transform: uppercase; }
.acc button { border: 2px solid var(--ink); border-radius: var(--r-md); padding: 0 14px; font-weight: 800; background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.acc button.ghost { background: var(--panel-hi); color: var(--text); }
.minis { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.mini { display: inline-flex; flex-direction: column; align-items: center; width: 64px; font-size: 11px; text-align: center; }
.mini img, .mini .ph { width: 52px; height: 52px; border-radius: var(--r-sm); border: 2px solid var(--ink); object-fit: cover; font-size: 16px; }
.mini b { font-weight: 700; margin-top: 3px; line-height: 1.15; }
.planrow { display: flex; align-items: center; gap: 6px; padding: 8px; margin-bottom: 8px; border-radius: var(--r-md);
  background: var(--panel); border: 3px solid var(--ink); }
.planrow .lbl2 { font-size: 12px; font-weight: 700; color: var(--muted); width: 58px; }
.planrow .arrow { font-weight: 900; color: var(--gold); font-size: 18px; }
.dock .us2 { background: var(--blue); } .dock .them2 { background: var(--red); }
.adv { background: var(--panel); border: 3px solid var(--ink); border-radius: var(--r-lg); padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 0 var(--ink); }
.adv p { margin: 6px 0; }
.lane { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.lane .vs { font-weight: 900; color: var(--muted); }
.lane .tag { margin-left: auto; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; border: 2px solid var(--ink); }
.tag.good { background: #3ad07a; color: var(--ink); } .tag.even { background: var(--panel-hi); } .tag.bad { background: var(--red); }
.mine { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0 0; }
.toggle { border: 2px solid var(--ink); border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 12px; background: var(--panel); }
.toggle.on { background: var(--gold); color: var(--ink); }
.br.owned { box-shadow: inset 0 0 0 3px var(--gold); }
.br.owned::after { content: "✓"; position: absolute; top: 2px; right: 4px; font-weight: 900; color: var(--gold); text-shadow: 0 1px 0 var(--ink); }
.sect { font-weight: 800; font-size: 13px; color: var(--muted); margin: 6px 2px 6px; }

/* сетка бойцов */
.search { display: flex; gap: 8px; margin: 4px 0 10px; position: sticky; top: 0; z-index: 2;
  padding: 6px 0; background: var(--night); }
.search input { flex: 1; min-width: 0; padding: 11px 12px; border-radius: var(--r-md); border: 3px solid var(--ink);
  background: #fff; color: var(--ink); font: inherit; font-weight: 700; outline: none; }
.search input:focus-visible { border-color: var(--gold); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 7px; }
.br { padding: 0; border-radius: var(--r-sm); border: 2px solid var(--ink); background: var(--panel); overflow: hidden; position: relative; }
.br img, .br .ph { width: 100%; aspect-ratio: 1; object-fit: cover; background: #16225a; }
.ph { display: grid; place-items: center; width: 100%; height: 100%; font-weight: 900; font-size: 20px; color: var(--muted); background: #16225a; }
.br span { display: block; font-size: 10.5px; font-weight: 700; padding: 3px 2px 4px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br:disabled { opacity: .28; }
.br:not(:disabled):active { transform: scale(.94); }
.br:focus-visible, .mode:focus-visible, .mapcard:focus-visible, .rec:focus-visible, .big:focus-visible, .iconbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(14,18,48,.92); backdrop-filter: blur(6px); }
.dock button { flex: 1; padding: 12px; border-radius: var(--r-md); border: 2px solid var(--ink); font-weight: 800;
  background: var(--panel); box-shadow: 0 3px 0 #000; }
.dock button.primary { background: var(--gold); color: var(--ink); }
.dock button:disabled { opacity: .4; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.done { text-align: center; font-weight: 900; font-size: 20px; margin: 14px 0; text-shadow: 0 2px 0 var(--ink); }
</style>
</head>

// ---- Аккаунт игрока: бот присылает прокачку в ссылке (#acc=...) ----
function b64urlToBytes(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  const bin = atob(s); return Uint8Array.from(bin, ch => ch.charCodeAt(0)); }
async function inflate(bytes) {   // версия 2: данные сжаты (raw deflate)
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function decodeAcc(code, name) {
  let by = b64urlToBytes(code);
  if (by[0] === 2) by = Uint8Array.from([1, ...(await inflate(by.slice(1)))]);
  if (by[0] !== 1) return null;
  const idToKey = {}; for (const k in S.ids) idToKey[S.ids[k]] = k;
  const acc = { name, b: {} }; let i = 1;
  while (i + 3 < by.length) {
    const id = 16000000 + by[i], power = by[i + 1], flags = by[i + 2], ng = by[i + 3]; i += 4;
    const gearIds = Array.from(by.slice(i, i + ng)).map(x => 62000000 + x); i += ng;
    const k = idToKey[id]; if (!k) continue; const it = S.items[k] || { gadgets: [], starPowers: [] };
    acc.b[k] = { power,
      gadgets: new Set(it.gadgets.filter((_, j) => flags & (1 << j)).map(x => x[1])),
      sps: new Set(it.starPowers.filter((_, j) => flags & (1 << (j + 2))).map(x => x[1])),
      hc: !!(flags & 16), gears: new Set(gearIds.map(g => S.gearById[g]).filter(Boolean)), gearIds,
      buffies: { g: !!(flags & 32), s: !!(flags & 64), h: !!(flags & 128) } };
  }
  return acc;
}

  res(safeGet(key)); }); }
function cloudSet(key, v) { safeSet(key, v);
  try { if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) tg.CloudStorage.setItem(key, v); } catch (e) {} }

function accountPenalty(c) {

  const a = ACC.b[c], notes = []; let pts = 0;

const US = "us", THEM = "them";
let st = { stage: "mode", mode: null, map: null, first: null, bans: [], ally: [], enemy: [], step: 0, got: 0, hist: [], q: "" };
function order(first) { const second = first === US ? THEM : US; return [[first, 1], [second, 2], [first, 2], [second, 1]]; }
function current() { const o = order(st.first); if (st.step >= o.length) return null; return [o[st.step][0], o[st.step][1] - st.got]; }
function snap() { st.hist.push(JSON.stringify({ ...st, hist: [] })); if (st.hist.length > 40) st.hist.shift(); }
function undo() { if (!st.hist.length) return; const h = st.hist; const prev = JSON.parse(h.pop()); st = { ...prev, hist: h, q: "" }; haptic("light"); render(); }
function taken() { return new Set([...st.bans, ...st.ally, ...st.enemy]); }
function dd() { return { map: st.map, mode: st.mode, bans: st.bans, ally: st.ally, enemy: st.enemy }; }
function haptic(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind); } catch (e) {} }

function tapBrawler(k) {
  if (taken().has(k)) return;
  if (st.stage === "bans") { snap(); st.bans.push(k); if (st.bans.length >= MAX_BANS) st.stage = "picks"; }
  else if (st.stage === "picks") { const cur = current(); if (!cur) return; snap();
    (cur[0] === US ? st.ally : st.enemy).push(k); st.got++;
    if (st.got >= order(st.first)[st.step][1]) { st.step++; st.got = 0; }
    if (!current()) st.stage = "done"; }
  st.q = ""; haptic("medium"); render(); window.scrollTo({ top: 0, behavior: "smooth" });
}

  const parts = [];
  if (b.gadget) parts.push(`<span>${b.gadget.map(x => icon("gadgets", x) + esc(thing(x)) + (a ? mark(a.gadgets, x) : "")).join(" / ")}</span>`);
  if (b.sp) parts.push(`<span>${b.sp.map(x => icon("star-powers", x) + esc(thing(x)) + (a ? mark(a.sps, x) : "")).join(" / ")}</span>`);
  if (b.gears) parts.push(`<span>${b.gears.map(x => icon("gears", x) + esc(thing(x)) + (a ? mark(a.gears, x) : "")).join(" + ")}</span>`);
  if (b.gearNote) parts.push(`<span class="where">🌿 ${esc(t(b.gearNote[0], { p: b.gearNote[1] }))}</span>`);
  const where = b.where ? `<span class="where">${t(b.where === "map" ? "for_map" : "for_mode")}</span>` : "";
  return `<div class="build">${parts.join("")}${where}</div>`;
}

function recCard(r, top, staticCard) {
  const role = roleName(B[r.c] ? B[r.c].cls : "");
  return `<button class="rec ${top ? "top" : ""}" ${staticCard ? 'tabindex="-1" style="pointer-events:none"' : `data-k="${r.c}"`}>
    <div class="ava">${imgOr(brawlerImg(r.c), initials(r.c), bname(r.c))}</div>
    <div><div class="nm">${esc(bname(r.c))}${role ? `<span class="cls">${esc(role)}</span>` : ""}</div>
    <div class="why">${r.why.map(whyText).map(esc).join(" · ")}</div>${buildHtml(r.c)}</div></button>`;
}

function matchup(a, e) {   // сглаженный винрейт a против e в этом режиме
  const [g, w] = (S.vs[st.mode] || {})[a + "|" + e] || [0, 0]; return (w + 10) / (g + 20);
}
function perms(a) { return a.length <= 1 ? [a] : a.flatMap((x, i) => perms(a.slice(0, i).concat(a.slice(i + 1))).map(p => [x, ...p])); }
function adviceHtml() {
  const A = st.ally, E = st.enemy; if (A.length < 3 || E.length < 3) return "";
  const names = l => l.map(bname).join(", ");
  // кто против кого: перебираем все 6 расстановок и берём самую выгодную для вас
  let best = null;
  for (const p of perms(E)) { const sc = A.reduce((s, a, i) => s + matchup(a, p[i]), 0); if (!best || sc > best[0]) best = [sc, p]; }
  const lanes = A.map((a, i) => { const m = matchup(a, best[1][i]); const tag = m >= .53 ? "good" : m <= .47 ? "bad" : "even";
    return `<div class="lane">${mini(a)}<span class="vs">vs</span>${mini(best[1][i])}<span class="tag ${tag}">${t("adv_" + tag)}</span></div>`; }).join("");
  // главная угроза: враг с наибольшим перевесом над вашей тройкой
  const threat = E.map(e => [e, A.reduce((s, a) => s + (.5 - matchup(a, e)), 0)]).sort((x, y) => y[1] - x[1])[0];
  const tips = [threat[1] > .03 ? t("adv_threat", { x: bname(threat[0]) }) : t("adv_no_threat")];
  const rng = k => B[k] && B[k].rng, cls = k => B[k] && B[k].cls;
  const divers = E.filter(k => cls(k) === "assassin"), longE = E.filter(k => rng(k) === "long"), tanksE = E.filter(k => rng(k) === "tank");
  const open = openness(st.map, st.mode);
  if (divers.length && A.some(k => rng(k) === "long")) tips.push(t("t_dive", { x: names(divers) }));
  if (longE.length && (open >= OPEN_MAP || A.filter(k => ["short", "tank"].includes(rng(k))).length >= 2)) tips.push(t("t_long", { x: names(longE) }));
  if (tanksE.length) tips.push(t("t_tanks", { x: names(tanksE) }));
  if (st.mode === "gem") { const order = ["tank", "support", "controller", "damage", "marksman", "artillery", "assassin"];
    const carrier = [...A].sort((a, b) => order.indexOf(cls(a)) - order.indexOf(cls(b)))[0]; tips.push(t("t_carrier", { x: bname(carrier) })); }
  tips.push(t("m_" + st.mode));
  if (hasMap(st.map, st.mode)) tips.push(t(open >= OPEN_MAP ? "map_open_tip" : open <= CLOSED_MAP ? "map_closed_tip" : "map_mid_tip"));
  return `<div class="title" style="margin-top:6px">${t("adv_title")}</div>
    <div class="adv"><div class="sect" style="margin-top:0">${t("adv_lanes")}</div>${lanes}</div>
    <div class="adv">${tips.map(x => `<p>• ${esc(x)}</p>`).join("")}</div>`;
}

function renderDraft() {
  const cur = st.stage === "picks" ? current() : null;
  // индекс следующего слота для подсветки
  let nextBan = st.stage === "bans" ? st.bans.length : -1, nextUs = -1, nextThem = -1;
  if (cur) { if (cur[0] === US) nextUs = st.ally.length; else nextThem = st.enemy.length; }
  let phase = "", hint = "", recs = "";
  if (st.stage === "bans") {
    phase = `<div class="phase">${t("bans_phase")}</div>`; hint = `<div class="hint">${t("bans_hint", { n: st.bans.length })}</div>`;
    const bc = banCandidates(st.map, st.mode, taken());
    if (bc.length) recs = `<div class="sect">${t("ban_sugg")}</div><div class="grid" style="margin-bottom:12px">${bc.map(gridItem).join("")}</div>`;
  } else if (cur && cur[0] === THEM) {
    phase = `<div class="phase them">${t("enemy_turn", { n: cur[1] })}</div>`; hint = `<div class="hint">${t("enemy_hint")}</div>`;
  } else if (cur && cur[0] === US) {
    phase = `<div class="phase us">${t("your_turn", { n: cur[1] })}</div>`; hint = `<div class="hint">${t("your_hint")}</div>`;
    const d = dd(); const first = recommend(d, 3);
    if (!first.length) recs = `<div class="empty">${t("nothing")}</div>`;
    else if (cur[1] === 1) recs = `<div class="recs">${first.map((r, i) => recCard(r, i === 0)).join("")}</div>`;
    else { const second = recommend({ ...d, ally: d.ally.concat([first[0].c]) }, 2);
      recs = `<div class="sect">${t("pair")}: ${esc(bname(first[0].c))}${second[0] ? " + " + esc(bname(second[0].c)) : ""}</div>
        <div class="recs">${first.map((r, i) => recCard(r, i === 0)).join("")}</div>
        ${second.length ? `<div class="sect">${t("then", { name: esc(bname(first[0].c)) })}</div><div class="recs">${second.map(r => recCard(r, false)).join("")}</div>` : ""}`; }
    const ni = niche(d); if (ni.length) recs += `<div class="sect">🧪 ${t("niche")}</div><div class="recs">${ni.map(r => recCard(r, false)).join("")}</div>`;
  } else if (st.stage === "done") {
    phase = `<div class="done">🏁 ${t("done")}</div>` + adviceHtml();
  }
  const title = st.map ? thing(st.map) : modeName(st.mode);
  app.innerHTML = `<div class="topbar"><img src="${CDN}/game-modes/regular/${D.modes[st.mode].id}.png" alt="" width="34" height="34" style="object-fit:contain" onerror="this.style.visibility='hidden'">
      <div class="grow"><div class="title" style="margin:0;font-size:19px">${esc(title)}</div>${mapLabel()}</div>${langBtn()}</div>
    <div class="board">${slots(st.bans, MAX_BANS, "bans", nextBan)}${slots(st.ally, 3, "us", nextUs)}${slots(st.enemy, 3, "them", nextThem)}</div>
    ${phase}${hint}${OWNED.size && st.stage !== "done" ? `<div style="margin:-2px 2px 10px"><button class="toggle ${ONLY_MINE ? "on" : ""}" data-act="onlymine">⭐ ${ONLY_MINE ? t("only_mine") : t("all")}</button></div>` : ""}${recs}
    ${st.stage === "done" ? "" : `<div class="search"><input id="q" type="search" placeholder="${t("search")}" value="${esc(st.q)}" autocomplete="off"></div>
    <div class="grid" id="grid">${gridHtml()}</div>`}`;
  dock.hidden = false;
  dock.innerHTML = `<button data-act="undo" ${st.hist.length ? "" : "disabled"}>↩️ ${t("undo")}</button>
    ${st.stage === "bans" && st.bans.length ? `<button class="primary" data-act="bansdone">${t("bans_done")}</button>` : ""}
    <button data-act="new">🆕 ${t("new")}</button>`;
  const q = document.getElementById("q");
  if (q) q.addEventListener("input", e => { st.q = e.target.value; document.getElementById("grid").innerHTML = gridHtml(); });
}

function gridItem(k) {
  const off = st.stage !== "my" && taken().has(k);
  const own = st.stage === "my" && OWNED.has(k);
  return `<button class="br ${own ? "owned" : ""}" data-k="${k}" ${off ? "disabled" : ""} ${st.stage === "my" ? `aria-pressed="${own}"` : ""}>${imgOr(brawlerImg(k), initials(k), bname(k))}<span>${esc(bname(k))}</span></button>`;
}
function gridHtml() {
  // порядок: сначала популярные на этой карте, потом остальные по алфавиту
  const tab = st.stage === "my" ? {} : ((st.map && S.mapB[st.map]) || S.modeB[st.mode] || {});
  let keys = Object.keys(B);
  const q = st.q.trim().toLowerCase().replace(/ё/g, "е");
  if (q) { const hit = new Set(ALIAS.filter(([a]) => a.includes(q)).map(([, k]) => k)); keys = keys.filter(k => hit.has(k)); }
  keys.sort((a, b) => ((tab[b] || [0])[0] - (tab[a] || [0])[0]) || bname(a).localeCompare(bname(b)));
  return keys.map(gridItem).join("") || `<div class="empty">—</div>`;
}

// ================= события =================
document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el || el.disabled) return;
  if (el.dataset.mode) { st.mode = el.dataset.mode; st.stage = "map"; haptic("light"); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.map !== undefined) { st.map = el.dataset.map || null; st.stage = "first"; haptic("light"); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.first) { snap(); st.first = el.dataset.first; st.stage = "bans"; haptic("light"); render(); return; }
  if (el.dataset.k && st.stage === "my") { const k = el.dataset.k; OWNED.has(k) ? OWNED.delete(k) : OWNED.add(k);
    el.classList.toggle("owned"); el.setAttribute("aria-pressed", OWNED.has(k));
    document.getElementById("mycount").textContent = t("my_count", { n: OWNED.size }); saveOwned(); haptic("light"); return; }
  if (el.dataset.k) { tapBrawler(el.dataset.k); return; }
  const act = el.dataset.act;
  if (act === "undo") undo();
  else if (act === "new") { st = { stage: "mode", mode: null, map: null, first: null, bans: [], ally: [], enemy: [], step: 0, got: 0, hist: [], q: "" }; render(); }
  else if (act === "bansdone") { snap(); st.stage = "picks"; haptic("light"); render(); }
  else if (act === "lang") { LANG = LANG === "ru" ? "en" : "ru"; safeSet("lang", LANG); document.documentElement.lang = LANG; render(); }
  else if (act === "back") goBack();
  else if (act === "accfind") {
    const tag = (document.getElementById("tag").value || "").toUpperCase().replace(/[^0289PYLQGRJCUV]/g, "");
    if (tag.length < 3) { document.getElementById("tag").focus(); return; }
    if (!API) { openBot(`tag_${tag}`); return; }
    el.disabled = true; el.textContent = t("acc_loading");
    apiFetch(`/api/profile?tag=${tag}`).then(async r => {
      if (r.status === 404) { toast(t("acc_notfound")); return; }
      if (!r.ok) throw new Error(r.status);
      const d = await r.json(); await applyAccount(d.acc, d.name, d.meta);
      haptic("medium"); st.stage = "profile"; st.q = ""; window.scrollTo(0, 0);
    }).catch(() => openBot(`tag_${tag}`))   // сервер бота недоступен — по-старому, через чат
      .finally(() => render());
  }
  else if (act === "img") {
    if (!API) { openBot(`img_${ACC_META.tag}`); return; }
    const txt = el.textContent; el.disabled = true; el.textContent = "🖼 " + t("img_wait");
    apiFetch("/api/card", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tag: ACC_META.tag, lang: LANG }) })
      .then(r => { if (!r.ok) throw new Error(r.status); haptic("medium"); toast(t("img_sent")); })
      .catch(() => openBot(`img_${ACC_META.tag}`))
      .finally(() => { el.disabled = false; el.textContent = txt; });
  }
  else if (act === "profile") { st.stage = "profile"; st.q = ""; render(); window.scrollTo(0, 0); }
  else if (act === "accforget") { ACC = null; OWNED = new Set(); cloudSet("acc", ""); cloudSet("acc_name", ""); loadOwned().then(render); }
  else if (act === "my") { st.stage = "my"; st.q = ""; render(); window.scrollTo(0, 0); }
  else if (act === "myall") { Object.keys(B).forEach(k => OWNED.add(k)); saveOwned(); render(); }
  else if (act === "mynone") { OWNED.clear(); saveOwned(); render(); }
  else if (act === "onlymine") { ONLY_MINE = !ONLY_MINE; render(); }
});
function goBack() { if (st.stage === "first") st.stage = "map"; else if (["map", "my", "profile"].includes(st.stage)) st.stage = "mode"; st.q = ""; render(); }

(async function init() {
  document.documentElement.lang = LANG;
  await initApi();
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#1B2A6B"); tg.setBackgroundColor("#1B2A6B"); } catch (e) {}
    tg.BackButton.onClick(goBack); }
  app.innerHTML = `<div class="empty">${t("loading")}</div>`;
  try { await Promise.all([load(), loadOwned()]); await loadAccount(); } catch (e) { app.innerHTML = `<div class="empty">${t("load_err")}</div>`; console.error(e); return; }
  render();
})();
</script>
</body>
